[tool.ruff]
# Код исторически написан в ширину до 100; при 88 форматтер разорвал бы половину
# вызовов на 3-4 строки без пользы для читаемости.
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear — реальные баги, не стиль
  "C4",       # comprehensions
  "SIM",      # упрощения
  "RET",      # return-паттерны
  "PTH",      # pathlib вместо os.path
  "TC",       # импорты в TYPE_CHECKING
  "RUF100",   # протухшие noqa
  "BLE",      # голый except Exception без причины
  "TRY",      # работа с исключениями
  "ARG",      # неиспользуемые аргументы
  "LOG", "G", # корректное логирование (в т.ч. lazy-форматирование)
  "DTZ",      # naive datetime без явного UTC
  "PERF",     # очевидные потери производительности
  "PIE",      # лишний код
  "PL",       # pylint
  "FURB",     # современные идиомы
]
# E501 — длину строк контролирует форматтер; B008 — ложный срабатывание на Depends() в FastAPI.
# TRY003 — проект осознанно пишет текст ошибки прямо в raise (сообщения уходят в UI).
# PLR2004 — «магические» числа в проверках SMTP-кодов (4xx/5xx) читаются лучше без констант.
ignore = ["E501", "B008", "TRY003", "PLR2004"]

# RUF001/RUF002/RUF003 (ambiguous-unicode) намеренно НЕ включены: на кириллице в комментариях
# и докстринках они дают ~105 ложных срабатываний (русские «а», «с», «е» похожи на латиницу).
