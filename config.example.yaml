# Настройки SMTP. Пароль здесь НЕ хранится — только в .env (SMTP_PASSWORD).
smtp:
  host: smtp.gmail.com     # Яндекс: smtp.yandex.ru, Mail.ru: smtp.mail.ru
  port: 587                # 587 — STARTTLS, 465 — SSL
  use_tls: true            # STARTTLS для порта 587
  # use_ssl: true          # раскомментировать для порта 465
  user: sender@example.com

# Необязательное отображаемое имя отправителя
from_name: "Иван Иванов"

# Тема и текст одинаковы для всех получателей
subject: "Документы по договору"

body: |
  Здравствуйте!

  Во вложении — документы по вашему договору.

  С уважением,
  Иван

# Необязательная HTML-версия письма (уходит вместе с текстовой)
body_html: null

# База для относительных путей вложений
attachments_dir: attachments

# Пауза между письмами в секундах (перекрывается флагом --delay)
delay: 2

recipients:
  - email: a@example.com
    name: "Анна Петрова"          # необязательно, попадёт в поле To
    attachments:
      - report_a.pdf              # путь относительно attachments_dir
      - invoice_a.xlsx
  - email: b@example.com
    attachments:
      - report_b.pdf
  - email: c@example.com
    attachments: []               # письмо без вложений — тоже допустимо
