[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear — реальные баги, не стиль
  "C4",       # comprehensions
  "SIM",      # упрощения
  "RET",      # return-паттерны
  "PTH",      # pathlib вместо os.path
  "TC",       # импорты в TYPE_CHECKING
]
# E501 — длину строк контролирует форматтер; B008 — ложный срабатывание на Depends() в FastAPI
ignore = ["E501", "B008"]
